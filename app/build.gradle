plugins { id 'com.android.application' }

android {
    namespace 'com.storeworkassistant'
    compileSdk 35
    defaultConfig {
        applicationId 'com.storeworkassistant'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.work:work-runtime:2.10.0'
}
